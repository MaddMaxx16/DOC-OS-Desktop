name: DOC OS Desktop Verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/diagnoseMarcusRoutes.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
